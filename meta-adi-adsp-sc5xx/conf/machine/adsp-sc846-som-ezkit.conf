require conf/machine/include/adsp-sc598-som.inc

# Do not modify below here

# Parameters for ADI LDR tool if a recipe needs them
LDR_PROC = "SC846"
LDR_BCODE ?= "2"

MACHINE_EXTRA_RDEPENDS = "adsp-boot"

UBOOT_MACHINE = "sc846-som-ezkit_defconfig"

UBOOT_ENTRYPOINT = "0x9a200000"
UBOOT_LOADADDRESS = "0x9a200000"
UBOOT_DTBADDRESS = "0x99000000"
UBOOT_RDADDR = "0x9c000000"

KERNEL_DEVICETREE = "adi/sc846-som-ezkit.dtb"

SERIAL_CONSOLES ?= "115200;ttySC0"

# Boot media images, laid out by the genimage configs in
# files/genimage/adsp-sc846-som-ezkit/: flash.cfg for the SPI boot flash,
# emmc.cfg for the SOM eMMC, and nand.cfg for the W25N08LW SPI NAND the
# carrier can have on xSPI1
ADSP_GENIMAGE_TYPES = "flash emmc nand"

MACHINE_EXTRA_RRECOMMENDS = "kernel-modules"
BOARD = "sc846-som-ezkit"
