require conf/distro/poky-tiny.conf
require adi-distro-shared.conf

DISTRO = "adi-distro-musl"
DISTRO_NAME = "Analog Devices Inc Reference Distro (musl)"

TARGET_VENDOR = "-adi_musl"
SDK_VENDOR = "-adi_musl_sdk"

# extrausers adds the target "shadow" package whenever EXTRA_USERS_PARAMS is set,
# but shadow hard-requires shadow-base, which poky-tiny excludes. The package is 
# unnecessary here, dropping it to avoid the conflict
PACKAGE_INSTALL:remove = "shadow"
