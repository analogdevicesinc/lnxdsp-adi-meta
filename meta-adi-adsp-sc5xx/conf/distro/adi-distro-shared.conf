DISTRO_VERSION = "6.0.0"

# LTO comes from OE-Core rather than being wired up here. Its opt-out list already
# covers the packages that fail to build or link with LTO, and it passes
# DEBUG_PREFIX_MAP at link time, which the hand-rolled version did not: LTO defers
# codegen to link, and the resulting LTRANS unit recorded TMPDIR in DW_AT_comp_dir.
# That leaked build paths into every -dbg package, silent while buildpaths was a
# warning and fatal on wrynose.
require conf/distro/include/lto.inc
DISTRO_FEATURES:append = " lto"

# Opt-outs beyond the ones lto.inc already lists.
LTO:pn-musl = ""
LTO:pn-gcc = ""
LTO:pn-binutils = ""
LTO:pn-gdb = ""
LTO:pn-lua = ""
LTO:pn-ltrace = ""
LTO:pn-linuxptp = ""
LTO:pn-ltp = ""
LTO:pn-uftrace = ""
LTO:pn-lttng-ust = ""
LTO:pn-openssh = ""
LTO:pn-valgrind = ""

# alsa-lib built without LTO here; lto.inc keeps it enabled with
# -flto-partition=none instead, which is the narrower fix for its inline asm.
# Left disabled until an image build says otherwise.
LTO:pn-alsa-lib = ""

DISTRO_FEATURES:remove = "sysvinit"

DISTRO_FEATURES:append = " systemd"
DISTRO_FEATURES_OPTED_OUT = "sysvinit"
VIRTUAL-RUNTIME_dev_manager = "udev"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"
VIRTUAL-RUNTIME_login_manager = "systemd"

DISTRO_FEATURES_FILTER_NATIVE:append = " systemd"
DISTRO_FEATURES_NATIVE:remove = "sysvinit"
DISTRO_FEATURES_NATIVE:append = " systemd"

DISTRO_FEATURES_FILTER_NATIVESDK:append = " systemd"
DISTRO_FEATURES_NATIVESDK:remove = "sysvinit"
DISTRO_FEATURES_NATIVESDK:append = " systemd"

PREFERRED_PROVIDER_virtual/kernel = "linux-adi"

INIT_MANAGER = "systemd"

# Wrynose promoted patch-status to the global ERROR_QA list; scarthgap only applied
# it to layer-core. 29 of our 42 patches predate the requirement, so do_patch fails
# on them. Demoted to a warning so the gap stays visible while the headers are
# added per patch, which needs a judgement per patch rather than a blanket value.
ERROR_QA:remove = "patch-status"
WARN_QA:append = " patch-status"
