# USB mass storage device for the ADSP-SC598 SOM rev E on the EZ-KIT, as the
# U-Boot environment reads it: the fitImage on the ext4 partition 1 (usbboot)
# and the ext4 rootfs on partition 2 (usbargs). The partitions are those the
# getting started guide creates with fdisk: a 32M partition 1 from 1M, and
# partition 2 after it.
image boot.ext4 {
	ext4 {
		label = "BOOT"
		use-mke2fs = true
	}
	mountpoint = "/boot"
	size = 32M
}

image usb.img {
	hdimage {
		partition-table-type = "mbr"
	}

	partition boot {
		partition-type = 0x83
		image = "boot.ext4"
		offset = 1M
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
