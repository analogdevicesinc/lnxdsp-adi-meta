# eMMC of the ADSP-SC598 SOM rev E on the EZ-KIT, as the boot ROM, SPL and the
# U-Boot environment read it: U-Boot SPL and U-Boot before the partitions, the
# fitImage on the ext4 partition 1 (mmcboot) and the ext4 rootfs on partition
# 2 (mmcargs).
image boot.ext4 {
	ext4 {
		label = "boot"
		use-mke2fs = true
	}
	mountpoint = "/boot"
	size = 64M
}

image emmc.img {
	hdimage {
		partition-table-type = "mbr"
	}

	# The boot ROM loads SPL from LBA 34
	partition u-boot-spl {
		in-partition-table = false
		image = "u-boot-spl.ldr"
		offset = 17K
	}

	partition u-boot {
		in-partition-table = false
		image = "u-boot.ldr"
		offset = 256K
	}

	partition boot {
		partition-type = 0x83
		bootable = true
		image = "boot.ext4"
		offset = 4M
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
