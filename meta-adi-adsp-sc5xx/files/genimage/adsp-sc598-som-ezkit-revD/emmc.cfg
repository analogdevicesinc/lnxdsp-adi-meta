# eMMC of the ADSP-SC598 SOM rev D on the EZ-KIT, as the boot ROM, SPL and the
# U-Boot environment read it: a GPT, U-Boot SPL and U-Boot before the
# partitions, the fitImage on the ext4 partition 1 (mmcboot) and the ext4
# rootfs on partition 2 (mmcargs).
image boot.ext4 {
	ext4 {
		label = "boot"
		use-mke2fs = true
	}
	mountpoint = "/boot"
	size = 64M
}

image emmc.img {
	hdimage {
		partition-table-type = "gpt"
	}

	# The boot ROM loads SPL from LBA 34, right after the GPT
	partition u-boot-spl {
		in-partition-table = false
		image = "u-boot-spl.ldr"
		offset = 17K
	}

	# Where U-Boot SPL has the boot ROM load U-Boot from in the eMMC
	# boot mode: block 512 (adi_rom_boot_args in sc59x_64-spl.c)
	partition u-boot {
		in-partition-table = false
		image = "u-boot.ldr"
		offset = 256K
	}

	partition boot {
		partition-type-uuid = L
		bootable = true
		image = "boot.ext4"
		offset = 256M
	}

	partition rootfs {
		partition-type-uuid = L
		image = "rootfs.ext4"
	}
}
