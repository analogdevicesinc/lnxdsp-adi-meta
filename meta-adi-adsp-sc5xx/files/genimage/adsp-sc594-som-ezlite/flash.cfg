# SPI boot flash of the ADSP-SC594 SOM on the EZ-LITE: a 64M SPI NOR with 64K
# erase blocks, partitioned as spi2 flash@1 in sc594-som.dtsi. U-Boot SPL,
# U-Boot, the fitImage at adi_image_offset, where spiboot loads it, and the
# EROFS rootfs UBI volume that spiargs mounts, up to the end of the flash.
flash boot-flash {
	pebsize = 64K
	numpebs = 1024
	minimum-io-unit-size = 1
	vid-header-offset = 64
	sub-page-size = 1
}

image flash.img {
	flash {}
	flashtype = "boot-flash"

	partition u-boot-spl {
		image = "u-boot-spl.ldr"
		size = 0x40000
	}

	partition u-boot {
		image = "u-boot.ldr"
		size = 0xc0000
	}

	partition kernel {
		image = "fitImage"
		size = 0xf00000
	}

	partition rootfs {
		image = "rootfs.ubi"
	}
}
