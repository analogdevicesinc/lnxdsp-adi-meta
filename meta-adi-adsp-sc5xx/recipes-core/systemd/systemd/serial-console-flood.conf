[Service]
# adsp-sc5xx serial console (ttySC0, fixed 115200) login-prompt flood fix.
#
# Two wrynose third-party regressions make agetty re-print the login prompt
# endlessly on the ADI serial console:
#
#  1. systemd 259 (exec-invoke.c, exec_context_shall_ansi_seq_reset): when
#     TTYReset=yes and TERM!=dumb it writes ANSI reset + OSC-3008 "context"
#     sequences to the getty tty on spawn. TTYReset=no/TTYVHangup=no stop that.
#
#  2. util-linux 2.41 agetty (get_logname): with more than one baud offered
#     (--keep-baud 115200,57600,38400,9600, numspeed>1) it re-prints the prompt
#     on any spurious NUL/BREAK from the line. The console speed is fixed, so
#     pin a single 115200 baud (numspeed==1) and agetty ignores the noise.
#
# TERM stays a real terminal (vt220) so the login shell keeps colour/cursor
# support; TERM=dumb would "work" but cripple interactive use.
Environment=TERM=vt220
TTYReset=no
TTYVHangup=no
ExecStart=
ExecStart=-/usr/sbin/agetty --noreset --noclear --issue-file=/etc/issue:/etc/issue.d:/run/issue.d:/usr/lib/issue.d --keep-baud 115200 - $TERM
