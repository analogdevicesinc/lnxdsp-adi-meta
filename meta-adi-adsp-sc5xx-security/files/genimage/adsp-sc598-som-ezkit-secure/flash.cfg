# SPI boot flash of the ADSP-SC598 SOM rev E on the EZ-KIT, for secure boot: a
# 128M SPI NOR with 64K erase blocks, partitioned as spi2 flash@1 in
# sc598-som-revE.dtsi. The U-Boot partition is enlarged for the signed U-Boot,
# as in 0002-sc598-Enlarge-u-boot-flash-partition-for-secure-boot.patch.
# U-Boot SPL, U-Boot, the fitImage at adi_image_offset, where spiboot loads
# it, and the EROFS rootfs UBI volume that spiargs mounts, up to the end of
# the flash.
flash boot-flash {
	pebsize = 64K
	numpebs = 2048
	minimum-io-unit-size = 1
	vid-header-offset = 64
	sub-page-size = 1
}

image flash.img {
	flash {}
	flashtype = "boot-flash"

	partition u-boot-spl {
		image = "u-boot-spl.ldr"
		size = 0x40000
	}

	partition u-boot {
		image = "u-boot.ldr"
		size = 0x1c0000
	}

	partition kernel {
		image = "fitImage"
		size = 0x2000000
	}

	partition rootfs {
		image = "rootfs.ubi"
	}
}
