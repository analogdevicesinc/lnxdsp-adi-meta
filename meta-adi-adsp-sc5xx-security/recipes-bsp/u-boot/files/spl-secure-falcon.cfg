CONFIG_SPL_FIT_SIGNATURE=y
CONFIG_SPL_RSA=y
CONFIG_SPL_RSA_VERIFY=y
CONFIG_SYS_SPI_KERNEL_OFFS=0x200000
CONFIG_SYS_SPI_U_BOOT_OFFS=0x100000
CONFIG_SPL_SYS_MMCSD_RAW_MODE=y
CONFIG_SYS_MMCSD_RAW_MODE_U_BOOT_USE_SECTOR=y
CONFIG_SYS_MMCSD_RAW_MODE_U_BOOT_SECTOR=0x800
CONFIG_SPL_CUSTOM_SYS_MALLOC_ADDR=0x97000000
# Only signed FITs: without these the SPL boots raw Image/u-boot.bin unverified
# CONFIG_SPL_RAW_IMAGE_SUPPORT is not set
# CONFIG_CMD_BOOTI is not set
# U-Boot proper: no unsigned legacy images or jumps to arbitrary code
# CONFIG_LEGACY_IMAGE_FORMAT is not set
# CONFIG_CMD_GO is not set
# CONFIG_CMD_ELF is not set
