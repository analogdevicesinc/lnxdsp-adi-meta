require conf/distro/adi-distro-glibc.conf

DISTRO = "adi-security"

DISTRO_FEATURES:append = " optee"
DISTRO_FEATURES:append = " signedboot"

LTO:pn-optee-os = ""
LTO:pn-optee-client = ""
LTO:pn-optee-test = ""
LTO:pn-libadiotp = ""
LTO:pn-libopteesharc = ""
LTO:pn-optee-examples = ""

# GCC 15 by default no longer zero-initializes the tail bytes of a union given only a
# partial initializer like `{ 0 }` which breaks mbedtls versions that uses the assumption.
# This is fixed at https://github.com/Mbed-TLS/TF-PSA-Crypto/pull/295
# and included on https://github.com/Mbed-TLS/TF-PSA-Crypto/releases/tag/v1.2.0
# bundled at https://github.com/Mbed-TLS/mbedtls/releases/tag/mbedtls-4.2.0
CFLAGS:append:pn-mbedtls = " -fzero-init-padding-bits=unions"

# adsp-signed-boot will automatically use optee-os; optee-test will include
# the optee-os-dev package as necessary
DISTRO_EXTRA_RDEPENDS = "adsp-signed-boot optee-client optee-test libadiotp libopteesharc optee-examples"
IMAGE_INSTALL:append = " optee-os-ta"

# The secure boot SC598 U-Boot partition is larger
# (0002-sc598-Enlarge-u-boot-flash-partition-for-secure-boot.patch), so use
# the board's -secure genimage configs, in this layer. The flash image holds
# the u-boot-spl.ldr signed by adsp-signed-boot.
ADSP_GENIMAGE_BOARD:append:adsp-sc598-som-ezkit = "-secure"
ADSP_GENIMAGE_DEPENDS:append = " adsp-signed-boot:do_deploy"

# This is the actual load address less 0x1c to account for the optee header
OPTEE_LOAD_ADDRESS ?= "0x9eefffe4"

# Actual start address in the middle of it, used for the optee shim that jumps to it
# when TFA is not available
OPTEE_START_ADDRESS ?= "0xcef00000"

require conf/distro/include/adsp-sc5xx-security.inc
